<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" role="img" aria-labelledby="layout-title layout-desc">
  <title id="layout-title">Layout</title>
  <desc id="layout-desc">A Rex session window tiled into three panes, with a stamped recipe badge.</desc>

  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#27386f"/>
      <stop offset="1" stop-color="#0c1229"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e7edfb"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38e8c8"/>
      <stop offset="1" stop-color="#6366f1"/>
    </linearGradient>
  </defs>

  <!-- tile -->
  <rect width="256" height="256" rx="56" fill="url(#tile)"/>
  <rect x="0.5" y="0.5" width="255" height="255" rx="55.5" fill="none" stroke="#ffffff" stroke-opacity="0.16"/>

  <!-- the spec: a small spark of provenance -->
  <path d="M226 36 l2.6 7.4 7.4 2.6 -7.4 2.6 -2.6 7.4 -2.6 -7.4 -7.4 -2.6 7.4 -2.6 z" fill="#a5b4fc" opacity="0.85"/>
  <circle cx="240" cy="64" r="2.5" fill="#a5b4fc" opacity="0.55"/>

  <!-- window -->
  <rect x="40" y="58" width="176" height="152" rx="16" fill="#05081a" opacity="0.30"/>
  <rect x="40" y="52" width="176" height="152" rx="16" fill="url(#paper)"/>
  <rect x="40.5" y="52.5" width="175" height="151" rx="15.5" fill="none" stroke="#0c1229" stroke-opacity="0.10"/>

  <!-- title bar -->
  <line x1="40" y1="80" x2="216" y2="80" stroke="#0c1229" stroke-opacity="0.12"/>
  <circle cx="58" cy="66" r="4.5" fill="#ff6b6b"/>
  <circle cx="73" cy="66" r="4.5" fill="#ffc857"/>
  <circle cx="88" cy="66" r="4.5" fill="#4ade80"/>
  <rect x="108" y="61" width="56" height="10" rx="5" fill="#0c1229" fill-opacity="0.10"/>

  <!-- tiled panes: 0.6 horizontal split, then a 0.5 vertical split -->
  <rect x="50" y="90" width="90" height="104" rx="7" fill="url(#accent)"/>
  <rect x="148" y="90" width="58" height="48" rx="7" fill="#18244d"/>
  <rect x="148" y="146" width="58" height="48" rx="7" fill="#18244d"/>

  <!-- editor -->
  <g stroke="#ffffff" stroke-width="5" stroke-linecap="round" opacity="0.82">
    <line x1="62" y1="108" x2="96" y2="108"/>
    <line x1="70" y1="122" x2="126" y2="122"/>
    <line x1="70" y1="136" x2="104" y2="136"/>
    <line x1="62" y1="150" x2="116" y2="150"/>
    <line x1="62" y1="164" x2="84" y2="164"/>
  </g>

  <!-- server -->
  <g stroke="#aebdf0" stroke-width="4.5" stroke-linecap="round" opacity="0.75">
    <line x1="158" y1="105" x2="188" y2="105"/>
    <line x1="158" y1="117" x2="196" y2="117"/>
  </g>
  <rect x="158" y="124" width="10" height="6" rx="1.5" fill="#38e8c8" opacity="0.95"/>

  <!-- logs -->
  <g stroke="#aebdf0" stroke-width="4.5" stroke-linecap="round" opacity="0.60">
    <line x1="158" y1="160" x2="192" y2="160"/>
    <line x1="158" y1="172" x2="184" y2="172"/>
    <line x1="158" y1="184" x2="176" y2="184"/>
  </g>

  <!-- stamped recipe -->
  <circle cx="206" cy="196" r="22" fill="url(#accent)" stroke="#ffffff" stroke-width="6"/>
  <path d="M196 196 L203 203 L216 188" fill="none" stroke="#ffffff" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
